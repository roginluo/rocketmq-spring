# Sample global config for monitoring JHipster applications
global:
  scrape_interval: 60s # By default, scrape targets every 15 seconds.
  evaluation_interval: 15s # By default, scrape targets every 15 seconds.
  # scrape_timeout is set to the global default (10s).

  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager).
  external_labels:
    monitor: 'jhipster'

# A scrape configuration containing exactly one endpoint to scrape:
# Here it's Prometheus itself.
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'rocketmq'

    # Override the global default and scrape targets from this job every 5 seconds.
    scrape_interval: 60s

    # scheme defaults to 'http' enable https in case your application is server via https
    #scheme: https
    # basic auth is not needed by default. See https://www.jhipster.tech/monitoring/#configuring-metrics-forwarding for details
    #basic_auth:
    # username: admin
    # password: admin
    metrics_path: /metrics
    dns_sd_configs:
      - names:
          - rmqbroker
        type: A
        port: 5557
  - job_name: 'consumer'
    scrape_interval: 60s
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names:
          - consumer
        type: A
        port: 8282
    relabel_configs:
      - source_labels: []
        target_label: 'application'
        replacement: 'rocketmq-consumer'